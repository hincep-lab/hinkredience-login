<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'">
<title>HINKredience°</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: #0B0B0D; color: #fff;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main {
    width: 100%; max-width: 420px; padding: 28px 24px;
    background: linear-gradient(135deg, #2A201B, #1A1513);
    border: 1px solid #4A3424; border-radius: 20px;
  }
  h1 { margin: 0 0 4px; font-size: 26px; letter-spacing: .3px; }
  h1 b { color: #E9E4DF; font-weight: 800; }
  h1 span { color: #E8A45D; font-weight: 500; }
  .tag { margin: 0 0 20px; color: #B8B4B0; font-style: italic; font-size: 14px; }
  h2 { margin: 0 0 8px; font-size: 18px; }
  p { margin: 0 0 12px; color: #B8B4B0; }
  p strong { color: #fff; }
  label { display: block; margin: 12px 0 4px; font-size: 14px; color: #B8B4B0; }
  input {
    width: 100%; padding: 12px 14px; font: inherit; color: #fff;
    background: #171719; border: 1px solid #4A3424; border-radius: 12px;
  }
  input:focus { outline: 2px solid #E8A45D; outline-offset: 1px; }
  button {
    width: 100%; margin-top: 14px; padding: 14px; font: inherit; font-weight: 700;
    border-radius: 28px; border: 1px solid #4A3424; cursor: pointer;
    background: transparent; color: #E8A45D;
  }
  button.primary { border: 0; color: #1B1108; background: linear-gradient(#E8A45D, #C87935); }
  button:disabled { opacity: .5; cursor: default; }
  ul { margin: 0 0 12px; padding-left: 20px; color: #B8B4B0; }
  .error { color: #E5645A; }
  .small { font-size: 13px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1><b>HINK</b><span>redience°</span></h1>
  <p class="tag">Dvě hlavy. Jedna dokonalá chuť.</p>
  <p>Tato adresa slouží jen k přihlášení při propojování kuchařky HINKredience° s dalšími aplikacemi. Sama o sobě nic nenabízí.</p>
</main>
</body>
</html>
